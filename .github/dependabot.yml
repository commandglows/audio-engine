version: 2
# Mensuel + groupe : 1 PR par ecosysteme et par mois (les alertes securite restent immediates).
updates:
  - package-ecosystem: "gradle"
    directories:
      - "/flutter/shipglows_audio/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      gradle_all:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directories:
      - "/flutter/shipglows_audio"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pub_all:
        patterns:
          - "*"
